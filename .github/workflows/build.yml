name: Build Telegram for KSign

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Cache Bazel Build Directory
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD', '**/BUILD.bazel', 'WORKSPACE', 'versions.json') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Setup Minimal Configuration
        run: |
          cd /Users/Shared/telegram-ios
          cat << 'EOF' > build-system/appstore-configuration.json
          {
            "bundle_id": "app.capricorn1136.rose5722",
            "api_id": "34064276",
            "api_hash": "79d1eeba6d4521f29a81dc40db4ec79a",
            "team_id": "Z72UR7V57D",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "true",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Patch BuildConfiguration.py to not require aps-environment
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          python3 - << 'PYEOF'
          path = "build-system/Make/BuildConfiguration.py"
          with open(path) as f:
              lines = f.readlines()

          target_idx = None
          for i, line in enumerate(lines):
              if "aps-environment' not in profile_dict['Entitlements']" in line:
                  target_idx = i
                  break

          if target_idx is None:
              raise SystemExit("Could not find aps-environment check line - source may have changed")

          patched = False
          for j in range(target_idx, min(target_idx + 5, len(lines))):
              if "sys.exit(1)" in lines[j]:
                  indent = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
                  lines[j] = indent + "return \"\"\n"
                  patched = True
                  break

          if not patched:
              raise SystemExit("Could not find sys.exit(1) near the aps-environment check - source may have changed")

          with open(path, "w") as f:
              f.writelines(lines)
          print("Patched BuildConfiguration.py successfully")
          PYEOF

      - name: Debug - inspect Make.py aps-environment check
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          sed -n '495,530p' build-system/Make/Make.py

      - name: Build the App for KSign
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

