name: Debug Codesigning Investigation

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Debug - extract identifiers from fake-codesigning profiles
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          for f in build-system/fake-codesigning/profiles/*.mobileprovision; do
            echo "=== $f ==="
            security cms -D -i "$f" > /tmp/decoded.plist 2>/dev/null
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/decoded.plist 2>/dev/null || echo "(could not read application-identifier)"
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/decoded.plist 2>/dev/null || echo "(could not read TeamIdentifier)"
            rm -f /tmp/decoded.plist
          done
